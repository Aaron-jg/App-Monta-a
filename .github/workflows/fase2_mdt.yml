# Ejecuta la fase 2 (modelo de elevaciones del IGN + comparación con OSM) en los
# servidores de GitHub, que sí tienen acceso al servicio WCS del IGN, y guarda el
# informe en la propia rama. El mosaico del MDT (pesado) queda como archivo descargable
# de la ejecución, en la pestaña "Actions".
#
# Se lanza sola al subir cambios a este archivo o al código de la fase 2,
# o a mano desde la pestaña "Actions" del repositorio (botón "Run workflow").
name: Fase 2 - modelo de elevaciones

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Código ISO de la región (p. ej. ES-VC)"
        default: "ES-VC"
      mdt:
        description: "Modelo: MDT25, MDT05 o MDT200"
        default: "MDT25"
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/fase2_mdt.yml"
      - "scripts/fase2_mdt.py"
      - "src/cimas/mdt.py"

permissions:
  contents: write

env:
  REGION: ${{ inputs.region || 'ES-VC' }}
  MDT: ${{ inputs.mdt || 'MDT25' }}

jobs:
  fase2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest tests -q

      - name: Recuperar teselas ya descargadas
        uses: actions/cache@v4
        with:
          path: data/mdt/teselas
          key: teselas-${{ env.MDT }}-${{ env.REGION }}-v1

      - name: Descarga del MDT y comparación con OSM
        run: python scripts/fase2_mdt.py --region "$REGION" --mdt "$MDT"

      - name: Informe en el resumen de la ejecución
        run: cat data/salida/fase2/mdt_*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el mosaico del MDT
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MDT }}-${{ env.REGION }}
          path: data/mdt/${{ env.MDT }}_${{ env.REGION }}.tif
          retention-days: 90

      - name: Subir resultados a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/salida/fase2
          if git diff --cached --quiet; then
            echo "Sin cambios en los resultados"
          else
            git commit -m "Fase 2: informe del modelo de elevaciones ($MDT)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
